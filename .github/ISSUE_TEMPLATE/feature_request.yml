name: Feature request
description: Explain the problem and a concrete use case.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and expected outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and impact
      description: Consider security, protocol changes, dependencies and compatibility.
