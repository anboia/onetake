name: Bug report
description: A minimal reproduction, without personal data or secrets.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Read CONTRIBUTING.md. Reporting a vulnerability? Follow SECURITY.md; do not post sensitive details here."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal command or example using synthetic data. Do not include a UDID, serial number, signing details or tokens.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, macOS, Xcode, iOS, Node and OBS. The iPhone model is sufficient; do not include a device identifier.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error / checks already performed
      description: Never paste full logs or screenshots from a personal device without reviewing them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I reviewed this report and removed personal data, credentials and real device identifiers.
          required: true
