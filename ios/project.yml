# Projeto iOS do OneTake. Nomes internos preservados por compatibilidade.
# Use `onetake runner build`: ele fornece as variáveis ONETAKE_* ao XcodeGen.
#
# - ContrarregraHost: app hospedeiro mínimo, só a tela do relógio de calibração (S0.10, S1 item 1).
# - ContrarregraRunner: bundle de UI test (XCUITest), com ID configurado pelo operador.
# - ContrarregraKit: pacote Swift local (modelos de S0, JSON-RPC, JCS, código do relógio).
#
# Assinatura: time explícito vindo da configuração, conta já logada no Xcode
# (`-allowProvisioningUpdates`); a identidade é a "Apple Development" desse time, conferida no
# `codesign -dvv` depois do build (AC-1.14). Nenhum alvo tem o bundle id do app alvo (P-4).
#
# Configuração Spike: compila ios/ContrarregraRunner/Spikes/ e liga a condição SPIKE (os métodos
# `spike.*` só existem nela); em Debug e Release a pasta Spikes/ fica fora do build.

name: Contrarregra
minimumXcodeGenVersion: 2.45.4

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  Spike: debug

settings:
  base:
    DEVELOPMENT_TEAM: ${ONETAKE_SIGNING_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.0.0
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Spike:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG SPIKE

packages:
  ContrarregraKit:
    path: ContrarregraKit

targets:
  ContrarregraHost:
    type: application
    platform: iOS
    sources:
      - path: ContrarregraHost
    dependencies:
      - package: ContrarregraKit
    settings:
      base:
        PRODUCT_NAME: ContrarregraHost
        PRODUCT_BUNDLE_IDENTIFIER: ${ONETAKE_HOST_BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"  # só iPhone; no alvo porque o preset de iOS do XcodeGen põe "1,2" aqui
        CODE_SIGN_IDENTITY: Apple Development
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OneTake
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # todas no Info.plist (exigência do iOS 26 sem UIRequiresFullScreen); a tela trava em retrato
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  ContrarregraRunner:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ContrarregraRunner
    dependencies:
      - target: ContrarregraHost
      - package: ContrarregraKit
    settings:
      base:
        PRODUCT_NAME: ContrarregraRunner
        PRODUCT_BUNDLE_IDENTIFIER: ${ONETAKE_RUNNER_TEST_BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"  # só iPhone (idem)
        GENERATE_INFOPLIST_FILE: YES
        EXCLUDED_SOURCE_FILE_NAMES: "*/ContrarregraRunner/Spikes/*"
      configs:
        Spike:
          EXCLUDED_SOURCE_FILE_NAMES: ""

schemes:
  ContrarregraRunner:
    build:
      targets:
        ContrarregraHost: all
        ContrarregraRunner: [test]
    test:
      config: Debug
      gatherCoverageData: false
      captureScreenshotsAutomatically: false
      deleteScreenshotsWhenEachTestSucceeds: true
      targets:
        - name: ContrarregraRunner
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release
