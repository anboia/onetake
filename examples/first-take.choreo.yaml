# OneTake: a single-scene template. Validation is offline; execution controls a real iPhone.
# Replace the app, version, language, screen and selectors with those of your app.
# The legacy schema is intentional: do not rename it to onetake.*.
schema: contrarregra.choreography/1
app:
  bundleId: com.example.demo
  iconLabel: Demo
  expectVersion: "1.0.0"
  urlPrefixes: []
device:
  language: en
  screenPt: { w: 390, h: 844 }
  textSize: UICTContentSizeCategoryL
  appearance: light
targets:
  # Prefer a label observed through ui_tree; do not guess coordinates.
  continueButton: { label: Continue, type: button }
# Open the app manually and prepare the starting screen before running.
prepare: []
scenes:
  - id: s01
    title: First interaction
    steps:
      - id: s01.ready
        do: waitFor
        condition: { element: { ref: continueButton }, state: hittable }
        timeoutMs: 10000
        onFail: abort
      - id: s01.continue
        do: tap
        target: { ref: continueButton }
        onFail: abort
      - id: s01.hold
        do: wait
        ms: 1000
cleanup: []
